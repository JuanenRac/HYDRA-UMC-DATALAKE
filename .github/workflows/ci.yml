name: HYDRA-UMC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Run the baseline steps of the family
        uses: ./.github/actions/hydra-baseline
        with:
          python-tests: src-path
          lint: full
      - name: Check the docker-compose.yml structure
        if: ${{ hashFiles('tools/verify_compose.py') != '' }}
        run: python tools/verify_compose.py
