<title id="t">HYDRA-UMC-DATALAKE architecture</title>
<desc id="d">HYDRA-UMC-DATALAKE is a real SQLite time-series store behind a plain JSON/HTTP surface. The telemetry collector writes into it, and the anomaly detector, the production reports and the dashboards read from it. Three token roles (ingest, admin, read) guard it, and every request and every query has a limit.</desc>
