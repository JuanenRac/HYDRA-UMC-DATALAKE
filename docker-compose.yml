# =============================================================================
# The data-and-analytics pipeline as four long-running services:
#
#   telemetry-collector  ->  datalake  <-  anomaly-detector, production-reports
#
# Each service builds from its own repository, checked out next to this one
# (../HYDRA-UMC-TELEMETRY-COLLECTOR, ../HYDRA-UMC-ANOMALY-DETECTOR,
# ../HYDRA-UMC-PRODUCTION-REPORTS), and is started with an explicit command:
# a bare invocation of these entry points only prints their identity.
#
#   TELEMETRY_COLLECTOR_TOKEN='a-secret-of-16-or-more-characters' \
#   DATALAKE_TOKEN='another-secret-of-16-or-more-characters' docker compose up --build
#
# The services talk to each other over the compose network. Their HTTP APIs
# have no accounts of their own, so every published port is bound to the
# loopback interface of the host (127.0.0.1) and nothing is reachable from
# the network; the collector's ingest routes require a bearer token, and so do
# the datalake's writing and administration routes (the history is deleted by
# POST /retention/apply): DATALAKE_TOKEN is the datalake's own token, which the
# collector sends along with every sample. Reading stays open inside the stack.
# Put a reverse proxy with its own authentication in front to expose any of
# them. The data lives in named volumes, so `docker compose down` keeps it.
#
# Not built in the environment this file was written in (no Docker there):
# `python tools/verify_compose.py` checks its structure, and the commands
# below are the ones that were run directly against the real services.
# =============================================================================

name: hydra-umc-datalake

services:
  datalake:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir .
        RUN useradd --system --uid 10001 hydra && mkdir /data && chown hydra /data
        USER hydra
    command: ["python", "-m", "hydra_umc_datalake.main", "--addr", "0.0.0.0", "--port", "8095", "--db", "/data/datalake.sqlite3"]
    environment:
      HYDRA_UMC_DATALAKE_TOKEN: ${DATALAKE_TOKEN:?set DATALAKE_TOKEN to a secret of at least 16 characters}
    volumes:
      - datalake-data:/data
    ports:
      - "127.0.0.1:8095:8095"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  telemetry-collector:
    build:
      context: ../HYDRA-UMC-TELEMETRY-COLLECTOR
      dockerfile_inline: |
        FROM golang:1.24-alpine AS build
        WORKDIR /app/src
        COPY src/ .
        RUN CGO_ENABLED=0 go build -o /out/telemetry-collector .
        FROM alpine:3.20
        COPY --from=build /out/telemetry-collector /usr/local/bin/telemetry-collector
        USER 65534:65534
    command: ["telemetry-collector", "-addr", "0.0.0.0:8092", "-datalake-url", "http://datalake:8095"]
    environment:
      HYDRA_UMC_TELEMETRY_COLLECTOR_TOKEN: ${TELEMETRY_COLLECTOR_TOKEN:?set TELEMETRY_COLLECTOR_TOKEN to a secret of at least 16 characters}
      # sent to the datalake with every sample
      HYDRA_UMC_DATALAKE_TOKEN: ${DATALAKE_TOKEN:?set DATALAKE_TOKEN to a secret of at least 16 characters}
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      datalake:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/stats"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  anomaly-detector:
    build:
      context: ../HYDRA-UMC-ANOMALY-DETECTOR
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir .
        RUN useradd --system --uid 10001 hydra && mkdir /data && chown hydra /data
        USER hydra
    command: ["python", "-m", "hydra_umc_anomaly_detector.main", "--addr", "0.0.0.0", "--port", "8097", "--baseline-path", "/data/baseline.npz"]
    volumes:
      - anomaly-detector-data:/data
    ports:
      - "127.0.0.1:8097:8097"
    depends_on:
      datalake:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/stats', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  production-reports:
    build:
      context: ../HYDRA-UMC-PRODUCTION-REPORTS
      dockerfile_inline: |
        FROM python:3.12-slim
        WORKDIR /app
        COPY . .
        RUN pip install --no-cache-dir .
        USER nobody
    command: ["python", "-m", "hydra_umc_production_reports.main", "--addr", "0.0.0.0", "--port", "8099", "--datalake-url", "http://datalake:8095"]
    ports:
      - "127.0.0.1:8099:8099"
    depends_on:
      datalake:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/stats', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  datalake-data:
  anomaly-detector-data:
